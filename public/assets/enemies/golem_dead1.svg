<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <ellipse cx="40" cy="72" rx="24" ry="10" fill="rgba(0,0,0,0.5)" />
  
  <g transform="translate(0, 10)">
    <!-- Right Arm falling away -->
    <path d="M 64 46 L 76 52 L 72 68 L 62 62 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" transform="rotate(30 65 55)"/>
    
    <!-- Left Arm falling away -->
    <path d="M 16 46 L 4 52 L 8 68 L 18 62 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" transform="rotate(-30 15 55)"/>

    <!-- Left Leg -->
    <path d="M 24 66 L 20 78 L 30 82 L 32 70 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Leg -->
    <path d="M 56 66 L 60 78 L 50 82 L 48 70 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" />

    <!-- Body Core Cracking -->
    <path d="M 26 46 L 40 34 L 54 46 L 48 66 L 32 66 Z" fill="#9E9E9E" stroke="#424242" stroke-width="2" stroke-linejoin="round"/>
    <!-- Core Rune fading -->
    <circle cx="40" cy="52" r="6" fill="#00BCD4" opacity="0.5" />
    <path d="M 40 40 L 40 60" stroke="#424242" stroke-width="2" /> <!-- Big crack -->
    
    <!-- Head falling back -->
    <path d="M 30 30 L 40 22 L 50 30 L 40 38 Z" fill="#BDBDBD" stroke="#424242" stroke-width="2" stroke-linejoin="round" transform="translate(0, -10) rotate(-15 40 30)"/>
    <rect x="36" y="26" width="8" height="3" fill="#00BCD4" opacity="0.5" transform="translate(0, -10) rotate(-15 40 30)"/>
  </g>
</svg>