      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  <ellipse cx="32" cy="56" rx="14" ry="6" fill="rgba(0,0,0,0.4)" />
  
  <g filter="url(#shadow)">
    <!-- Right Arm -->
    <path d="M 40 32 C 48 30, 52 36, 46 42" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linecap="round" />
    <!-- Staff tilted -->
