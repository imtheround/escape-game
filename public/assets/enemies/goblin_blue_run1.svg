    <!-- Body -->
    <path d="M 26 28 Q 32 34 38 28 L 36 46 Q 32 48 28 46 Z" fill="#311B92" stroke="#1A237E" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Left Arm -->
    <path d="M 24 32 C 16 36, 18 46, 26 42" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linecap="round" />

    <!-- Head -->
    <g transform="translate(0, 2)">
      <ellipse cx="32" cy="22" rx="12" ry="10" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" />
      <path d="M 20 22 Q 10 18 12 26 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="2"/>
      <path d="M 44 22 Q 54 18 52 26 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="2"/>
      <circle cx="28" cy="20" r="2" fill="#00E5FF" />
      <circle cx="36" cy="20" r="2" fill="#00E5FF" />
    </g>
  </g>
</svg>