      </feMerge>
    </filter>
  </defs>
  <ellipse cx="40" cy="72" rx="24" ry="10" fill="rgba(0,0,0,0.5)" />
  
  <g filter="url(#shadow)">
    <path d="M 52 36 L 62 38 L 66 52 L 54 48 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" />
    <path d="M 60 42 L 62 48" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>

    <path d="M 32 56 L 28 66 L 38 72 L 40 60 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" />
    <path d="M 48 56 L 56 64 L 46 68 L 40 60 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" />

    <path d="M 26 38 L 40 26 L 54 38 L 48 58 L 32 58 Z" fill="#9E9E9E" stroke="#424242" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="40" cy="44" r="6" fill="#00E5FF" filter="url(#glow)" />
    <path d="M 40 38 L 40 50 M 34 44 L 46 44" stroke="#B2EBF2" stroke-width="2" />
    
    <path d="M 28 36 L 18 42 L 18 56 L 26 52 Z" fill="#757575" stroke="#424242" stroke-width="2" stroke-linejoin="round" />
    <path d="M 22 46 L 22 52" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>

    <g transform="translate(0, 2)">
