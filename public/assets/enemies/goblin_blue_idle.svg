<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Shadow under feet -->
  <ellipse cx="32" cy="56" rx="14" ry="6" fill="rgba(0,0,0,0.4)" />
  
  <g filter="url(#shadow)">
    <!-- Right Arm -->
    <path d="M 38 32 C 44 34, 46 42, 42 46" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linecap="round" />
    
    <!-- Weapon (Staff) -->
    <path d="M 40 20 L 44 60" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing Gem -->
    <circle cx="40" cy="20" r="4" fill="#00E5FF" />

    <!-- Left Leg -->
    <path d="M 26 48 L 24 56 L 28 56 L 30 48 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Leg -->
    <path d="M 38 48 L 40 56 L 36 56 L 34 48 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linejoin="round" />

    <!-- Body / Robes -->
    <path d="M 24 30 Q 32 36 40 30 L 40 48 Q 32 50 24 48 Z" fill="#311B92" stroke="#1A237E" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Left Arm -->
    <path d="M 26 32 C 20 34, 18 42, 22 46" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linecap="round" />

    <!-- Head -->
    <ellipse cx="32" cy="22" rx="12" ry="10" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" />
    <!-- Ears -->
    <path d="M 20 22 Q 10 18 12 26 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 44 22 Q 54 18 52 26 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" stroke-linejoin="round"/>

    <!-- Eyes -->
    <circle cx="28" cy="20" r="2" fill="#00E5FF" />
    <circle cx="36" cy="20" r="2" fill="#00E5FF" />
  </g>
</svg>