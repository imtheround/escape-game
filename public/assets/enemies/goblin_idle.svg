<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Shadow under feet -->
  <ellipse cx="32" cy="56" rx="14" ry="6" fill="rgba(0,0,0,0.4)" />
  
  <g filter="url(#shadow)">
    <!-- Right Arm (Back) -->
    <path d="M 38 32 C 44 34, 46 42, 42 46" fill="#7CB342" stroke="#33691E" stroke-width="2" stroke-linecap="round" />
    <!-- Weapon (Dagger) -->
    <path d="M 40 44 L 54 38 L 56 40 L 42 48 Z" fill="#9E9E9E" stroke="#424242" stroke-width="2" stroke-linejoin="round"/>
    <rect x="40" y="44" width="6" height="8" rx="2" fill="#5D4037" transform="rotate(-30 40 44)"/>

    <!-- Left Leg -->
    <path d="M 26 48 L 24 56 L 28 56 L 30 48 Z" fill="#7CB342" stroke="#33691E" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Leg -->
    <path d="M 38 48 L 40 56 L 36 56 L 34 48 Z" fill="#7CB342" stroke="#33691E" stroke-width="2" stroke-linejoin="round" />

    <!-- Body / Armor -->
    <path d="M 24 30 Q 32 36 40 30 L 38 48 Q 32 50 26 48 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
    <!-- Belt -->
    <path d="M 25 42 Q 32 44 39 42" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Arm (Front) -->
    <path d="M 26 32 C 20 34, 18 42, 22 46" fill="#7CB342" stroke="#33691E" stroke-width="2" stroke-linecap="round" />

    <!-- Head -->
    <ellipse cx="32" cy="22" rx="12" ry="10" fill="#7CB342" stroke="#33691E" stroke-width="2" />
    <!-- Ears -->
    <path d="M 20 22 Q 10 18 12 26 Z" fill="#7CB342" stroke="#33691E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 44 22 Q 54 18 52 26 Z" fill="#7CB342" stroke="#33691E" stroke-width="2" stroke-linejoin="round"/>

    <!-- Eyes -->
    <circle cx="28" cy="20" r="2" fill="#FFEE58" />
    <circle cx="36" cy="20" r="2" fill="#FFEE58" />
    <!-- Angry Eyebrows -->
    <path d="M 24 16 L 30 18" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
    <path d="M 40 16 L 34 18" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M 30 26 Q 32 28 34 26" fill="none" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>