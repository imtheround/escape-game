    <!-- Body -->
    <path d="M 26 28 Q 32 34 38 28 L 36 46 Q 32 48 28 46 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 27 40 Q 32 42 37 40" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Arm (Swinging forward) -->
