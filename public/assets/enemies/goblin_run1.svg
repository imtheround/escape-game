<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  <ellipse cx="32" cy="56" rx="14" ry="6" fill="rgba(0,0,0,0.4)" />
  
  <g filter="url(#shadow)">
