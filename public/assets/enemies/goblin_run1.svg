      <circle cx="28" cy="20" r="2" fill="#FFEE58" />
      <circle cx="36" cy="20" r="2" fill="#FFEE58" />
      <path d="M 24 16 L 30 18" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
      <path d="M 40 16 L 34 18" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
      <path d="M 30 26 Q 32 28 34 26" fill="none" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
    </g>
