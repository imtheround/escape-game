<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-opacity="0.4" />
    </filter>
  </defs>
  <ellipse cx="40" cy="70" rx="22" ry="8" fill="rgba(0,0,0,0.5)" />
  
  <g filter="url(#shadow)">
    <!-- Weapon (Giant Club) -->
    <path d="M 50 50 L 65 20 A 8 8 0 0 1 75 25 L 60 55 Z" fill="#795548" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="70" cy="22" r="2" fill="#3E2723" />
    <circle cx="68" cy="28" r="2" fill="#3E2723" />
    <circle cx="73" cy="26" r="2" fill="#3E2723" />

    <!-- Right Arm -->
    <path d="M 48 36 C 58 38, 60 50, 52 56" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linecap="round" />
    <!-- Right Shoulder Pad -->
    <path d="M 46 32 C 54 28, 62 34, 58 42" fill="#424242" stroke="#212121" stroke-width="2"/>

    <!-- Left Leg -->
    <path d="M 32 58 L 28 68 L 34 70 L 38 60 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Leg -->
    <path d="M 48 58 L 52 68 L 46 70 L 42 60 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linejoin="round" />

    <!-- Body -->
    <path d="M 28 36 Q 40 44 52 36 L 48 60 Q 40 64 32 60 Z" fill="#6D4C41" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 28 50 Q 40 54 52 50" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left Arm -->
    <path d="M 32 36 C 22 38, 20 50, 28 56" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linecap="round" />
    <!-- Left Shoulder Pad -->
    <path d="M 34 32 C 26 28, 18 34, 22 42" fill="#424242" stroke="#212121" stroke-width="2"/>

    <!-- Head -->
    <ellipse cx="40" cy="26" rx="16" ry="14" fill="#5D4037" stroke="#3E2723" stroke-width="2" />
    <!-- Ears -->
    <path d="M 24 26 L 16 22 L 20 30 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 56 26 L 64 22 L 60 30 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
    <!-- Tusks -->
    <path d="M 34 36 L 32 30 L 36 34 Z" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
    <path d="M 46 36 L 48 30 L 44 34 Z" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="34" cy="22" r="2.5" fill="#E53935" />
    <circle cx="46" cy="22" r="2.5" fill="#E53935" />
    <!-- Heavy Brow -->
    <path d="M 28 18 L 38 20" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
    <path d="M 52 18 L 42 20" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>